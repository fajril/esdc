name: CI

on:
  push:
    branches: [main, develop, "feature/**", "feat/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test_shards:
    name: test_shards (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build pinned SQLite runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/sqlite-autoconf-3540100.tar.gz"
          source_dir="${RUNNER_TEMP}/sqlite-autoconf-3540100"
          prefix="${RUNNER_TEMP}/sqlite-3.54.1"
          curl --fail --location --silent --show-error \
            https://www.sqlite.org/2026/sqlite-autoconf-3540100.tar.gz \
            --output "$archive"
          python - "$archive" <<'PY'
          import hashlib
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          actual = hashlib.sha3_256(archive.read_bytes()).hexdigest()
          expected = "b6ced585c750916b1052667239a12c25a7ff34e7f06e1e6e01ecb0427657d9c4"
          if actual != expected:
              raise SystemExit(f"SQLite archive SHA3-256 mismatch: {actual}")
          PY
          mkdir -p "$source_dir"
          tar -xzf "$archive" --strip-components=1 -C "$source_dir"
          (
            cd "$source_dir"
            ./configure --prefix="$prefix" --enable-shared --disable-static --enable-rtree
            make -j2
            make install
          )
          echo "ESDC_SQLITE_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --python "$(command -v python)" --group dev

      - name: Verify SQLite runtime
        shell: bash
        run: |
          set -euo pipefail
          extension="$(uv run python -c 'import _sqlite3; print(_sqlite3.__file__)')"
          ldd "$extension"
          ldd "$extension" | grep -F "$ESDC_SQLITE_PREFIX/lib/libsqlite3.so"
          uv run python - <<'PY'
          import sqlite3

          from esdc.sqlite_runtime import require_wal_runtime

          if sqlite3.sqlite_version != "3.54.1":
              raise SystemExit(f"Expected SQLite 3.54.1, got {sqlite3.sqlite_version}")
          require_wal_runtime()
          with sqlite3.connect(":memory:") as probe:
              probe.execute(
                  "CREATE VIRTUAL TABLE rtree_probe USING rtree(id, min_x, max_x, min_y, max_y)"
              )
          print(f"SQLite {sqlite3.sqlite_version} WAL runtime and R*Tree verified")
          PY

      # Offline analytics recovery forbids automatic extension downloads, so provision
      # the extension cache once per runner before the suites read it.
      - name: Provision DuckDB extension cache
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          """Provision the DuckDB extension cache required by offline analytics recovery."""

          import duckdb

          REQUIRED_EXTENSIONS = ("vss", "spatial", "fts")

          connection = duckdb.connect(
              ":memory:", config={"autoinstall_known_extensions": "false"}
          )

          try:
              loaded: list[str] = []
              for extension in REQUIRED_EXTENSIONS:
                  connection.execute(f"INSTALL {extension}")
                  connection.execute(f"LOAD {extension}")
                  loaded.append(extension)

              rows = connection.execute(
                  "SELECT extension_name FROM duckdb_extensions() WHERE installed"
              ).fetchall()
              cached = {row[0] for row in rows}
              missing = sorted(set(REQUIRED_EXTENSIONS) - cached)
              if missing:
                  raise SystemExit(
                      f"DuckDB extension cache is incomplete: {', '.join(missing)}"
                  )

              print(f"DuckDB {duckdb.__version__} extension cache ready: {', '.join(loaded)}")
          finally:
              connection.close()
          PY

      - name: Lint
        run: uv run ruff check esdc/ tests/

      - name: Type check
        run: uv run basedpyright .

      # Run the failing knowledge pipeline first, with INFO logs for refusal paths.
      - name: Knowledge end-to-end diagnostic
        shell: bash
        run: uv run pytest -v --tb=long --log-cli-level=INFO tests/knowledge/test_end_to_end.py

      # Check POD context and payload portability before the full suite.
      - name: POD focused checks
        shell: bash
        run: uv run pytest -v -x --tb=short tests/pod_registry/test_api_context_v2.py tests/pod_registry/test_api_payload_v2.py

      - name: Test shard
        shell: bash
        run: |
          set -euo pipefail
          # Spawn-based tests re-run the launcher main module, so the shard runner
          # needs a real file path rather than stdin.
          shard_script="${RUNNER_TEMP}/test_shards.py"
          cat > "$shard_script" <<'PY'
          """Run only the test modules assigned to this shard."""

          import hashlib
          import sys

          import pytest
          from pytest import hookimpl

          TOTAL_GROUPS = 6
          BASE_ARGS = ["-v", "-x", "--tb=short"]


          def module_group(nodeid: str) -> int:
              """Assign a test module to one shard with a stable SHA256 digest."""
              module = nodeid.split("::", 1)[0]
              digest = hashlib.sha256(module.encode("utf-8")).digest()
              return int.from_bytes(digest[:8], "big") % TOTAL_GROUPS


          class ShardSelector:
              """pytest plugin that keeps only the modules owned by one shard."""

              def __init__(self, shard: int) -> None:
                  if not 0 <= shard < TOTAL_GROUPS:
                      raise SystemExit(
                          f"Invalid shard index {shard}: expected 0-{TOTAL_GROUPS - 1}"
                      )
                  self.shard = shard

              @hookimpl
              def pytest_collection_modifyitems(
                  self, config: pytest.Config, items: list[pytest.Item]
              ) -> None:
                  total = len(items)
                  selected = [item for item in items if module_group(item.nodeid) == self.shard]
                  deselected = [item for item in items if module_group(item.nodeid) != self.shard]
                  config.hook.pytest_deselected(items=deselected)
                  items[:] = selected
                  print(
                      f"shard {self.shard}: selected {len(selected)} of {total} collected items"
                  )


          def main(argv: list[str]) -> int:
              """Run the shard, optionally narrowed by extra pytest selectors."""
              if not argv:
                  raise SystemExit("usage: test_shards.py <shard_index> [pytest selectors]")

              shard, *selectors = argv
              plugin = ShardSelector(int(shard))
              return pytest.main(BASE_ARGS + selectors, plugins=[plugin])


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv[1:]))
          PY
          uv run python "$shard_script" "${{ matrix.shard }}"

  # Aggregate gate that keeps the required check name 'test'.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test_shards
    if: always()
    env:
      SHARDS_RESULT: ${{ needs.test_shards.result }}
    steps:
      - name: Verify every shard succeeded
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SHARDS_RESULT:-}" != "success" ]; then
              echo "test gate failed: aggregate shard result=${SHARDS_RESULT:-empty}"
              exit 1
          fi
          echo "test gate passed: aggregate shard result=success"
