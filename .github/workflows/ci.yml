name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        # llama-cpp-python resolves to a prebuilt cpu wheel on Linux via the
        # platform-marked [tool.uv.sources] index in pyproject.toml (no source
        # compile) — no extra env needed.
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check esdc/ tests/

      - name: Test
        run: uv run pytest -q
