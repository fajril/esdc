{% extends "base.html" %}
{% block content %}
{% for grid in grids %}
<section class="grid-section">
  <h2>{{ grid.title }}</h2>
  {% if not grid.config.readonly %}
  <div class="toolbar">
    <button class="add-row" data-table="{{ grid.table }}">+ Add row</button>
    <button class="save" data-table="{{ grid.table }}">Save</button>
    <button class="clear-all" data-table="{{ grid.table }}">Clear all</button>
    <button class="discard" data-table="{{ grid.table }}">Discard</button>
  </div>
  {% endif %}
  <div class="grid-errors" id="errors-{{ grid.table }}" hidden></div>
  <div id="grid-{{ grid.table }}" class="grid"></div>
  <script type="application/json" id="config-{{ grid.table }}">{{ grid.config | tojson }}</script>
</section>
{% endfor %}
<script>document.addEventListener("DOMContentLoaded", () => initGrids());</script>
{% endblock %}
