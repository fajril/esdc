<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ESDC Eureka{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/eureka.css" rel="stylesheet">
</head>
<body class="eureka-body">
    <nav class="navbar navbar-expand-lg eureka-nav">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/eureka/">
                <i class="bi bi-building"></i> ESDC Eureka
            </a>
            <span class="navbar-text text-white-50 d-none d-md-inline">
                Resources Knowledge Pages
            </span>
            <div class="d-flex align-items-center ms-auto">
                <label for="year-select" class="text-white-50 me-2">Report Year:</label>
                <select id="year-select" class="form-select form-select-sm" style="width:auto;">
                    {% for y in years %}
                    <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 py-3">
        {% block content %}{% endblock %}
    </main>

    <footer class="eureka-footer">
        <div class="container-fluid px-4">
            <small class="text-muted">
                Data source: SKK Migas ESDC | Report Year: {{ selected_year }}
                | Generated by <code>esdc eureka</code>
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script>
        document.getElementById('year-select').addEventListener('change', function() {
            const year = this.value;
            window.location.href = '/eureka/?year=' + year;
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
