<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ESDC Eureka{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="/static/eureka.css" rel="stylesheet">
</head>
<body class="eureka-body">
  <header class="top-bar">
    <a href="/eureka/" class="top-bar-brand">
      <span class="brand-icon">E</span>
      <span>
        ESDC Eureka
        <span class="brand-subtitle">Resources Knowledge Pages</span>
      </span>
    </a>
    <div class="year-control">
      <label for="year-select">Year</label>
      <select id="year-select" class="year-dropdown">
        {% for y in years %}
        <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
        {% endfor %}
      </select>
    </div>
  </header>

  <div class="layout-grid">
    <aside class="sidebar">
      <div>
        <div class="sidebar-section-title">Navigation</div>
        <nav class="sidebar-nav">
          <a href="/eureka/" class="sidebar-nav-item active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
          </a>
          <a href="/eureka/api/nkri/export?year={{ selected_year }}&format=csv" class="sidebar-nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Export Data
          </a>
        </nav>
      </div>
      <div>
        <div class="sidebar-section-title">Status</div>
        <div style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.75rem;font-size:0.8rem;color:var(--text-muted);">
          <span class="status-dot pulse"></span>
          Data Active
        </div>
        <div style="font-family:var(--font-mono);font-size:0.65rem;color:var(--text-muted);padding:0 0.75rem;margin-top:0.25rem;">
          {{ selected_year }}
        </div>
      </div>
    </aside>
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <footer class="eureka-footer">
    <div class="footer-left">
      <span class="status-dot pulse"></span>
      Data source: SKK Migas ESDC &nbsp;|&nbsp; Report Year: {{ selected_year }}
    </div>
    <div class="footer-right">
      Generated by <code>esdc eureka</code> v0.7.0
    </div>
  </footer>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script>
    document.getElementById('year-select').addEventListener('change', function() {
      window.location.href = '/eureka/?year=' + this.value;
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
