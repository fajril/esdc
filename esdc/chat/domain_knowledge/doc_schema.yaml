table_name: documents
description: >-
  Corpus of Indonesian oil & gas official documents (regulatory instruments,
  letters, MoM, berita acara, contracts, and more) ingested via `esdc corpus`,
  searchable by iris through search_documents.
llm_fields: # order = order of definition lines in METADATA_PROMPT
  - name: doc_type
    type: string
    enum: [uu, perpu, mk, pp, permen, kepmen, letter, mom, ba, note, psc, gsa, pod, ptk, sop, others]
    prompt: |-
      one of "uu" (undang-undang) | "perpu" (peraturan pengganti UU) | "mk"
        (putusan Mahkamah Konstitusi) | "pp" (peraturan pemerintah) | "permen"
        (peraturan menteri) | "kepmen" (keputusan menteri) | "letter" (official
        letter: persetujuan/edaran/umum) | "mom" (minutes of meeting) | "ba"
        (berita acara) | "note" (non-binding note) | "psc" (production sharing
        contract) | "gsa" (gas sales agreement) | "pod" (POD approval book) |
        "ptk" (pedoman tata kerja SKK Migas) | "sop" (standard operating
        procedure) | "others"
    description: >-
      Document category: regulatory instruments (uu, perpu, mk, pp, permen,
      kepmen, ptk, sop — high to low legal force), letter (official letter),
      mom (minutes of meeting), ba (berita acara), note (non-binding note),
      psc (production sharing contract), gsa (gas sales agreement), pod (POD
      approval book), or others.
    aliases: [jenis dokumen, tipe surat]
  - name: doc_number
    type: string
    prompt: >-
      the document/letter number exactly as written
    description: >-
      The document or letter reference number, transcribed exactly as written.
    aliases: [nomor surat, nomor dokumen]
  - name: doc_date
    type: date
    prompt: >-
      ISO date YYYY-MM-DD
    description: >-
      The document's issue date, in ISO format (YYYY-MM-DD).
    aliases: [tanggal surat, tanggal dokumen]
  - name: subject
    type: string
    prompt: >-
      perihal or meeting title
    description: >-
      The subject line (perihal) of a letter, or the title of a meeting.
    aliases: [perihal, judul]
  - name: sender
    type: string
    prompt: >-
      issuing organization or signatory org
    description: >-
      Issuing or signing ORGANIZATION (e.g. SKK Migas, a KKKS) — not a person.
    aliases: [pengirim, penerbit, dari]
  - name: recipient
    type: string
    prompt: >-
      addressed organization (letters only)
    description: >-
      The organization the document is addressed to (letters only).
    aliases: [penerima, kepada]
  - name: doc_level
    type: string
    enum: [wk, field, project, unknown]
    prompt: >-
      "wk" | "field" | "project" | "unknown" — the scope this document is about
    description: >-
      The scope this document is about: wk (working area / wilayah kerja),
      field (lapangan), project, or unknown.
    aliases: [tingkat dokumen, cakupan]
  - name: wk_name
    type: list[string]
    prompt: |-
      list of working area (wilayah kerja) names mentioned
        (e.g. ["Rokan", "Mahakam"])
    description: >-
      List of working area (wilayah kerja) names mentioned in the document.
    aliases: [wilayah kerja, nama WK]
  - name: field_name
    type: list[string]
    prompt: >-
      list of field (lapangan) names mentioned (e.g. ["Duri", "Minas"])
    description: >-
      List of field (lapangan) names mentioned in the document.
    aliases: [lapangan, nama field]
  - name: project_name
    type: list[string]
    prompt: >-
      list of project or POD names mentioned (e.g. ["POD Duri", "POD Minas"])
    description: >-
      List of project or POD (Plan of Development) names mentioned in the document.
    aliases: [nama proyek, nama POD]
  - name: extras
    type: object
    prompt: |-
      object with doc_type-specific fields, e.g. for mom:
        {{"peserta": [...], "keputusan": [...]}}
    description: >-
      Additional doc_type-specific fields (e.g. participants and decisions for
      a mom document). Stored as JSON in the metadata column.
    aliases: [tambahan]
housekeeping_fields: # set by the pipeline, not the LLM
  - name: source_file
    description: >-
      Original file name the sidecar was extracted from. Stored in the
      file_name column.
  - name: file_hash
    description: SHA-256 hash of the source file bytes; used as the dedup key.
  - name: page_count
    description: Number of pages in the source document.
  - name: extraction_method
    description: Extraction method used to obtain the document text (native or OCR).
  - name: raw_entities
    description: >-
      Raw entity-resolution candidates captured before canonicalization,
      stored as JSON.
doc_types: # authoritative glossary, one entry per doc_type enum value
  - name: uu
    title: Undang-Undang
    description: Undang-undang (UU) — produk hukum tertinggi hasil legislasi.
  - name: perpu
    title: Peraturan Pemerintah Pengganti Undang-Undang
    description: >-
      Peraturan pemerintah pengganti undang-undang (Perpu), diterbitkan dalam
      kondisi mendesak dan setara UU.
  - name: mk
    title: Putusan Mahkamah Konstitusi
    description: Putusan Mahkamah Konstitusi (MK), setara UU dalam kekuatan hukum.
  - name: pp
    title: Peraturan Pemerintah
    description: Peraturan pemerintah (PP) — aturan pelaksana di bawah UU.
  - name: permen
    title: Peraturan Menteri
    description: Peraturan menteri (permen) — peraturan yang diterbitkan Menteri.
  - name: kepmen
    title: Keputusan Menteri
    description: Keputusan menteri (kepmen) — kebijakan yang diambil Menteri.
  - name: letter
    title: Surat Resmi
    description: >-
      Surat resmi yang diterbitkan lembaga: surat persetujuan, surat edaran,
      atau surat umum.
  - name: mom
    title: Minutes of Meeting
    description: >-
      Minutes of meeting (MoM) — kesepakatan rapat yang dituangkan dalam
      dokumen.
  - name: ba
    title: Berita Acara
    description: Berita acara (BA).
  - name: note
    title: Catatan
    description: Catatan tidak mengikat, cenderung informatif.
  - name: psc
    title: Production Sharing Contract
    description: >-
      Production sharing contract (PSC) — kontrak yang melandasi kegiatan
      usaha hulu migas antara kontraktor dan SKK Migas.
  - name: gsa
    title: Gas Sales Agreement
    description: Gas sales agreement (GSA) — perjanjian jual beli gas.
  - name: pod
    title: Persetujuan POD
    description: >-
      Buku persetujuan POD, memuat informasi teknis pelaksanaan plan of
      development.
  - name: ptk
    title: Pedoman Tata Kerja
    description: >-
      Pedoman tata kerja (PTK) — pedoman resmi SKK Migas sebagai acuan
      pelaksanaan kegiatan usaha hulu migas.
  - name: sop
    title: Standard Operating Procedure
    description: Standard operating procedure (SOP) — aturan proses bisnis internal institusi.
  - name: others
    title: Lainnya
    description: Jenis dokumen di luar tipe lain.
doc_type_hierarchy: # regulatory force, high to low; ties share a level
  - [uu, perpu, mk]
  - [pp]
  - [permen]
  - [kepmen]
  - [ptk]
  - [sop]
legacy_doc_type_map:
  surat: letter
  other: others
enums:
  doc_level: [wk, field, project, unknown]
  doc_type: [uu, perpu, mk, pp, permen, kepmen, letter, mom, ba, note, psc, gsa, pod, ptk, sop, others]
