  - name: superseded_by
    formal_name: Superseded By
    logical_type: integer
    data_type: BIGINT
    nullable: true
    declared_nullable: true
    ownership: input
    unit: null
    precision: null
    scale: null
    max_length: null
    constraint: NULL; REFERENCES m_pod(pod_id_seq) ON UPDATE RESTRICT ON DELETE RESTRICT; CHECK (superseded_by
      <> pod_id_seq); NON-UNIQUE INDEX on superseded_by; controlled atomic writer; acyclic graph and strictly
      later replacement approval_date enforced by trigger
    description: References the approval that replaces THIS approval. NULL means no recorded replacement,
      not an original/root approval. Several old approvals may point to one replacement, including a merger.
      Select eligible old approvals; the controlled writer creates the replacement and updates their superseded_by
      and is_latest atomically. Reject missing targets, self-links, cycles and non-later replacement dates.
      A later phase that leaves this approval valid is not supersession. Audited corrections must preserve
      issued identities.
    group: null
    source: null
    aliases: []
