    precision: null
    scale: null
    max_length: null
    constraint: NOT NULL; REFERENCES r_pod_type(id) ON UPDATE RESTRICT ON DELETE RESTRICT; CHECK (pod_type_id
      BETWEEN 1 AND 9); immutable after creation
    description: One-digit POD type identifier referencing r_pod_type(id). The ID is embedded as component
      B in pod_id.
    group: null
    source: null
    aliases: []
  - name: rev_num
    formal_name: Revision Number
    logical_type: integer
    data_type: INTEGER
    nullable: false
    declared_nullable: false
    ownership: input
    unit: null
    precision: null
    scale: null
    max_length: null
    constraint: NOT NULL; CHECK (rev_num BETWEEN 0 AND 9); explicit revision number in pod_name first,
      otherwise calculated via reverse superseded_by lookup; recalculate after name/chain corrections
      before identity issuance; controlled write; issued identity corrections require reconciliation
    description: 'Use an explicit revision number qualifying Revisi/Revision in pod_name when present.
      POD Pertama/POD I and phase, area or well numbers are not revision numbers. Otherwise use 0 for
      a root, or MAX(predecessor.rev_num)+1 using predecessor.superseded_by = current.pod_id_seq, including
      mergers. Explicit names take precedence over trace; log differences (Sisi Nubi ID 614: name 2, trace
      3, use 2). Recalculate after name or chain corrections before issuing IDs. K107 supersedes the previous
      merger-numbering hold.'
    group: null
    source: null
    aliases: []
  - name: pod_order_no
    formal_name: Year-scoped POD Ordering Number
    logical_type: integer
    data_type: SMALLINT
    nullable: false
    declared_nullable: false
    ownership: derived
    unit: null
    precision: null
    scale: null
    max_length: null
    constraint: NOT NULL; CHECK (pod_order_no BETWEEN 1 AND 7320); unique expression index on ((EXTRACT(YEAR
      FROM approval_date)::integer), pod_order_no); controlled allocator validates the date-specific 20-slot
      block; persistent ledger; immutable after issuance; direct INSERT/UPDATE prohibited
    description: 'Forms XXXX in PL-YYYY-XXXX-A-B-R. pod_order_no = (day_of_year(approval_date)-1)*20 +
      daily_slot; daily_slot is 1..20 in persistent recording order for that date. Day 1: 0001-0020; day
      2: 0021-0040; day 366: 7301-7320 in leap years only (common-year maximum 7300). Every approval,
      including revisions, consumes its own slot across all institutions/types. Historical additions use
      unused slots on their actual date without shifting issued numbers. If all 20 slots are used, stop
      issuance for that date; never spill to another date or reuse an issued slot, including after deletion.
      Ledger allocation and writes are atomic. K108 replaces annual increments 10,20,30.'
    group: null
    source: null
    aliases: []
    minimum: -32768
    maximum: 32767
  - name: pod_id
    formal_name: POD ID following KSMI Standard
    logical_type: text
    data_type: VARCHAR(18)
    nullable: false
    declared_nullable: false
    ownership: derived
    unit: null
    precision: null
    scale: null
    max_length: 18
    constraint: NOT NULL; UNIQUE; CHECK (pod_id ~ '^PL-[0-9]{4}-[0-9]{4}-[0-9]-[0-9]-[0-9]$'); generated
      by controlled database function from approval_date, pod_order_no, institution_id, pod_type_id, and
      rev_num; immutable after creation; direct INSERT/UPDATE prohibited
    description: 'Immutable 18-character identifier PL-YYYY-XXXX-A-B-R. YYYY is the approval year; XXXX
      is pod_order_no padded to four digits, allocated in a 20-slot block for the approval day under K108.
      A is institution_id; B is pod_type_id; R follows K107: explicit revision number in pod_name first,
      otherwise root 0 or MAX(predecessor.rev_num)+1. Each approval including revisions gets its own ordering
      slot. Issued IDs must never be changed or reused; reconcile corrections before issuance.'
    group: null
    source: null
    aliases: []
    pattern: ^PL-[0-9]{4}-[0-9]{4}-[0-9]-[0-9]-[0-9]$
