- name: pod_project
  role: input
  required: true
  source_names:
  - pod_project
  - project_pod
  primary_key:
  - id
  unique_keys:
  - - pod_project_uuid
  - - pod_id_seq
    - project_id
  references:
  - column: pod_id_seq
    target_table: m_pod
    target_column: pod_id_seq
  - column: project_id
    target_table: m_project
    target_column: project_id
  columns:
  - name: id
    formal_name: Project record ID
    logical_type: integer
    data_type: BIGINT
    nullable: false
    declared_nullable: null
    ownership: derived
    unit: null
    precision: null
    scale: null
    max_length: null
    constraint: PRIMARY KEY; GENERATED ALWAYS AS IDENTITY
    description: Unique integer identifier for each POD project record.
    group: null
    source: null
    aliases: []
  - name: pod_project_uuid
    formal_name: POD Project Junction UUID v4
    logical_type: uuid
    data_type: UUID
    nullable: false
    declared_nullable: false
    ownership: derived
    unit: null
    precision: null
    scale: null
    max_length: null
    constraint: NOT NULL; UNIQUE; DEFAULT gen_random_uuid(); UPDATE prohibited by trigger
    description: Globally unique UUID v4 identifier for the POD–eSDC project junction record.
    group: null
    source: null
    aliases: []
    uuid_version: 4
  - name: pod_id_seq
    formal_name: POD ID Sequence
    logical_type: integer
    data_type: BIGINT
    nullable: false
    declared_nullable: false
    ownership: input
    unit: null
    precision: null
    scale: null
    max_length: null
    constraint: NOT NULL; REFERENCES m_pod(pod_id_seq) ON UPDATE RESTRICT ON DELETE RESTRICT; UNIQUE (pod_id_seq,
      project_id)
    description: Links this project record to its POD master record.
    group: null
    source: null
    aliases:
    - pod_id
  - name: project_id
    formal_name: eSDC Project ID
    logical_type: text
    data_type: TEXT
    nullable: false
    declared_nullable: false
    ownership: input
    unit: null
    precision: null
    scale: null
    max_length: null
    constraint: NOT NULL; UNIQUE (pod_id_seq, project_id); validated against eSDC project master by integration/service
    description: External eSDC project identifier. The same project may map to multiple PODs; validation
      is performed by the eSDC integration because no local project-master table is defined.
